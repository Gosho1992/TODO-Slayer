<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TODO Slayer</title>
<meta name="description" content="Your AI left IOUs in your code. Now they're monsters. Fix them, push, rescan — git decides who dies." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>" />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0d0b14; --panel: #17131f; --panel2: #201a2b; --line: #322a40;
    --text: #ece6f5; --dim: #9a8fae; --blood: #ff4d5e; --gold: #ffcb47; --mint: #4dffb8; --violet: #a77bff;
    --pixel: "Press Start 2P", monospace; --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(1200px 600px at 50% -10%, #2a1838 0%, var(--bg) 60%) fixed, var(--bg); color: var(--text); font-family: var(--mono); min-height: 100vh; }
  a { color: inherit; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0 16px; }
  .logo { font-family: var(--pixel); font-size: 14px; white-space: nowrap; letter-spacing: 1px; cursor: pointer; }
  .logo span { color: var(--blood); }
  .xp { font-family: var(--pixel); font-size: 9px; color: var(--gold); display: flex; align-items: center; gap: 8px; }
  .xpbar { width: 90px; height: 8px; background: var(--panel2); border: 1px solid var(--line); }
  .xpbar i { display: block; height: 100%; background: var(--gold); transition: width .6s; }

  /* Home */
  .hero { text-align: center; padding: 56px 0 32px; }
  .hero h1 { font-family: var(--pixel); font-size: clamp(22px, 6vw, 46px); line-height: 1.3; margin: 0 0 20px; text-shadow: 4px 4px 0 #5a1020; }
  .hero h1 em { color: var(--blood); font-style: normal; }
  .hero p { color: var(--dim); max-width: 620px; margin: 0 auto 32px; line-height: 1.6; font-size: 15px; }
  .btn { font-family: var(--pixel); font-size: 12px; border: 0; padding: 16px 22px; cursor: pointer; color: #1a0c10; background: var(--blood); box-shadow: 0 4px 0 #8e1d2b; transition: transform .08s; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #8e1d2b; }
  .btn.gold { background: var(--gold); box-shadow: 0 4px 0 #8a6a12; }
  .btn.ghost { background: transparent; color: var(--dim); box-shadow: none; border: 1px solid var(--line); }
  .btn:disabled { opacity: .5; cursor: wait; }
  .big { font-size: 16px; padding: 20px 34px; }
  .or { color: var(--dim); font-size: 12px; margin: 28px 0 14px; }
  form.summon { display: flex; gap: 8px; max-width: 560px; margin: 0 auto; }
  form.summon input { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); color: var(--text); font-family: var(--mono); font-size: 14px; padding: 14px; }
  .howto { margin: 48px auto 0; max-width: 980px; text-align: left; }
  .howto h2 { font-family: var(--pixel); font-size: 13px; color: var(--gold); text-align: center; margin: 0 0 18px; letter-spacing: 1px; }
  .howto .fine { text-align: center; }
  .steps { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .steps li { position: relative; background: var(--panel); border: 1px solid var(--line); padding: 16px 14px 14px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; }
  .steps .num { position: absolute; top: -12px; left: 12px; font-family: var(--pixel); font-size: 11px; background: var(--blood); color: #1a0c10; padding: 6px 8px; box-shadow: 0 3px 0 #8e1d2b; }
  .steps img { width: 64px; height: 64px; object-fit: cover; border-radius: 50%; -webkit-mask-image: radial-gradient(circle, #000 62%, transparent 72%); mask-image: radial-gradient(circle, #000 62%, transparent 72%); }
  .steps b { font-family: var(--pixel); font-size: 10px; color: var(--text); }
  .steps p { margin: 0; color: var(--dim); font-size: 12.5px; line-height: 1.55; }
  @media (max-width: 860px) { .steps { grid-template-columns: repeat(2, 1fr); row-gap: 22px; } }
  @media (max-width: 480px) { .steps { grid-template-columns: 1fr; } }
  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 40px; }
  .chip { font-size: 12px; padding: 6px 10px; background: var(--panel); border: 1px solid var(--line); color: var(--dim); }
  .fine { color: var(--dim); font-size: 12px; margin-top: 18px; }

  /* Arena */
  .bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; background: var(--panel); border: 1px solid var(--line); padding: 14px; margin-bottom: 16px; }
  .bar .repo { font-weight: 700; }
  .bar .sha { color: var(--dim); font-size: 12px; }
  .stats { display: flex; gap: 18px; font-family: var(--pixel); font-size: 10px; }
  .stats b { display: block; font-size: 16px; margin-top: 6px; color: var(--blood); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .demo-tag { font-family: var(--pixel); font-size: 8px; color: var(--violet); border: 1px solid var(--violet); padding: 4px 6px; margin-left: 8px; vertical-align: middle; }
  .hint { color: var(--dim); font-size: 13px; margin: -4px 0 16px; line-height: 1.5; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .card { position: relative; background: var(--panel); border: 1px solid var(--line); padding: 14px; display: flex; flex-direction: column; gap: 8px; animation: spawn .45s cubic-bezier(.2,1.6,.4,1) both; }
  .card.boss { grid-column: 1 / -1; border: 2px solid var(--blood); background: linear-gradient(135deg, #2b0f18, var(--panel)); padding: 20px; }
  .card .top { display: flex; align-items: center; gap: 10px; }
  .card .icon { font-size: 34px; line-height: 1; animation: bob 2.4s ease-in-out infinite; }
  .card.boss .icon { font-size: 64px; }
  .card .name { font-family: var(--pixel); font-size: 10px; line-height: 1.5; }
  .card.boss .name { font-size: 15px; color: var(--blood); }
  .badge { font-family: var(--pixel); font-size: 7px; padding: 3px 5px; border: 1px solid currentColor; display: inline-block; margin-bottom: 4px; }
  .quote { font-size: 12.5px; background: #0f0c16; border-left: 3px solid var(--line); padding: 8px; word-break: break-word; }
  .where { font-size: 11px; color: var(--dim); text-decoration: none; word-break: break-all; }
  .where:hover { color: var(--text); }
  .age { font-size: 12px; color: var(--gold); }
  .taunt { font-size: 12px; color: var(--dim); font-style: italic; }
  .hp { height: 10px; background: #2a1520; border: 1px solid #4a2030; }
  .hp i { display: block; height: 100%; background: linear-gradient(90deg, var(--blood), #ff8a5c); transition: width .5s; }
  .hpnum { font-family: var(--pixel); font-size: 8px; color: var(--blood); }
  .card.dying { animation: die .9s ease-in forwards; pointer-events: none; }
  .card.dying .hp i { width: 0 !important; }
  .dmg { position: absolute; top: 30%; left: 50%; transform: translateX(-50%); font-family: var(--pixel); font-size: 22px; color: var(--gold); text-shadow: 3px 3px 0 #5a1020; animation: rise 1s ease-out forwards; z-index: 2; white-space: nowrap; }

  .banner { position: fixed; left: 50%; top: 38%; transform: translateX(-50%); z-index: 10; background: #120d1a; border: 2px solid var(--gold); padding: 16px 20px; font-family: var(--pixel); font-size: 11px; line-height: 1.8; text-align: center; animation: drop .4s ease-out both; max-width: calc(100% - 32px); box-shadow: 0 10px 40px #000a; }
  .banner .kills { color: var(--blood); font-size: 15px; }
  .banner .gain { color: var(--gold); }
  .banner.new { border-color: var(--violet); }

  .victory { text-align: center; padding: 60px 16px; background: var(--panel); border: 2px solid var(--mint); }
  .victory h2 { font-family: var(--pixel); color: var(--mint); font-size: clamp(18px, 4vw, 28px); line-height: 1.5; }
  .victory p { color: var(--dim); }
  .loading { text-align: center; padding: 80px 0; font-family: var(--pixel); font-size: 12px; color: var(--dim); line-height: 2; }
  .loading .icon { font-size: 48px; display: block; animation: bob 1s ease-in-out infinite; }
  .err { background: #2b0f18; border: 1px solid var(--blood); padding: 12px; margin: 16px auto; max-width: 560px; font-size: 13px; }
  .ledger { margin-top: 24px; background: var(--panel); border: 1px solid var(--mint); padding: 16px; }
  .ledger h3 { font-family: var(--pixel); font-size: 11px; color: var(--mint); margin: 0 0 12px; line-height: 1.6; }
  .kill { display: grid; grid-template-columns: 1.4fr 1.4fr auto auto; gap: 12px; align-items: center; font-size: 12.5px; padding: 8px 0; border-top: 1px solid var(--line); }
  .kill i { color: var(--gold); font-style: normal; font-size: 11px; }
  .kill .file { color: var(--dim); word-break: break-all; }
  .kill .hpk { font-family: var(--pixel); font-size: 9px; color: var(--gold); }
  .kill .sha2 { font-size: 11px; color: var(--mint); white-space: nowrap; }
  @media (max-width: 560px) { .kill { grid-template-columns: 1fr auto; } .kill .file { grid-column: 1 / -1; order: 3; } }
  .hdr-right { display: flex; align-items: center; gap: 12px; }
  .snd { font-family: var(--pixel); font-size: 8px; background: transparent; color: var(--text); border: 1px solid var(--line); padding: 7px 8px; cursor: pointer; }
  .snd:hover { border-color: var(--gold); }
  .card { cursor: pointer; }
  .card .sprite { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; flex: none; animation: bob 2.4s ease-in-out infinite; -webkit-mask-image: radial-gradient(circle, #000 62%, transparent 72%); mask-image: radial-gradient(circle, #000 62%, transparent 72%); }
  .card.boss .sprite { width: 170px; height: 170px; filter: drop-shadow(0 0 18px #ff2a3d88); animation: bossbreathe 3s ease-in-out infinite; }
  .card.talk .sprite { animation: talk .5s ease-in-out 2; }
  .card.boss .top { gap: 18px; }
  .spark { position: fixed; width: 7px; height: 7px; z-index: 20; pointer-events: none; animation: spark .8s ease-out forwards; }
  .verify { position: fixed; left: 50%; top: 30%; transform: translateX(-50%); z-index: 15; background: #0b0910ee; border: 2px solid var(--mint); padding: 18px 22px; font-family: var(--mono); font-size: 14px; line-height: 1.9; color: var(--mint); min-width: min(380px, calc(100% - 32px)); box-shadow: 0 10px 50px #000c; }
  .verify div:first-child { font-family: var(--pixel); font-size: 10px; color: var(--text); margin-bottom: 4px; }
  .verify.out { opacity: 0; transition: opacity .3s; }
  @keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }
  @keyframes talk { 25% { transform: scale(1.12) rotate(-4deg); } 75% { transform: scale(1.12) rotate(4deg); } }
  @keyframes bossbreathe { 50% { transform: scale(1.04); filter: drop-shadow(0 0 30px #ff2a3dcc); } }
  @media (max-width: 560px) { .card.boss .sprite { width: 110px; height: 110px; } .snd { padding: 6px; } }
  footer { color: var(--dim); font-size: 11px; text-align: center; padding: 40px 0 24px; line-height: 1.7; }

  @keyframes spawn { from { opacity: 0; transform: scale(.6) translateY(20px); } }
  @keyframes bob { 50% { transform: translateY(-4px); } }
  @keyframes die { 0% { transform: none; } 10%,30%,50% { transform: translateX(-6px) rotate(-2deg); filter: brightness(2.5) saturate(0); } 20%,40% { transform: translateX(6px) rotate(2deg); } 100% { transform: scale(.2) rotate(18deg); opacity: 0; filter: brightness(3); } }
  @keyframes rise { from { opacity: 1; transform: translate(-50%, 0) scale(.8); } to { opacity: 0; transform: translate(-50%, -70px) scale(1.4); } }
  @keyframes drop { from { opacity: 0; transform: translate(-50%, -30px); } }
  @media (max-width: 560px) { form.summon { flex-direction: column; } .stats { gap: 12px; } .logo { font-size: 11px; white-space: nowrap; } .xpbar { display: none; } .xp { white-space: nowrap; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" onclick="goHome()">TODO <span>SLAYER</span> ⚔️</div>
    <div class="hdr-right"><button class="snd" id="snd" onclick="toggleSound()" title="Sound">🔇 SOUND</button><div class="xp"><span id="lvl">LV 1</span><div class="xpbar"><i id="xpfill" style="width:0"></i></div><span id="xpnum">0 XP</span></div></div>
  </header>
  <main id="app"></main>
  <footer>
    Detects TODO / FIXME / HACK / XXX, placeholder comments common in AI-assisted code, unimplemented stubs and silent exceptions.<br />
    Deterministic scan pinned to your latest commit — no AI guesses who lives or dies. Git does.
  </footer>
</div>

<script>
const SPRITES = { TODO: "todo", FIXME: "fixme", HACK: "hack", PLACEHOLDER: "placeholder", STUB: "stub", SILENT: "silent" };
const TYPES = {
  TODO:        { label: "TODO",        color: "#ffcb47" },
  FIXME:       { label: "FIXME",       color: "#ff4d5e" },
  HACK:        { label: "HACK",        color: "#ff8a5c" },
  PLACEHOLDER: { label: "PLACEHOLDER", color: "#a77bff" },
  STUB:        { label: "STUB",        color: "#4dffb8" },
  SILENT:      { label: "SILENT CATCH",color: "#8ec5ff" },
};

// ---------- Demo army (no network, no key) ----------
const DEMO = {
  repo: "demo/vibe-coded-saas", sha: "d3m0c0de", commitMsg: "ship it 🚀", demo: true,
  monsters: [
    { id:"b1", tag:"FIXME", icon:"👹", name:"FIXME Troll", title:"The Ancient Race Condition", text:"race condition when two users checkout at once", file:"src/checkout/cart.ts", line:212, ageDays:933, bornOn:"2024-03-17", author:"you", taunt:"You left me here 933 days ago, Zain. I am still waiting.", hp:933, boss:true },
    { id:"m1", tag:"TODO", icon:"👺", name:"TODO Goblin", title:"Refresh Token Hobgoblin", text:"implement refresh tokens", file:"src/auth/session.ts", line:48, ageDays:211, taunt:"You said you'd do it later.", hp:300 },
    { id:"m2", tag:"PLACEHOLDER", icon:"🧟", name:"Placeholder Zombie", title:"The Mock Data Mummy", text:"for now, return mock data", file:"src/api/analytics.ts", line:17, ageDays:64, taunt:"This isn't even real data.", hp:232 },
    { id:"m3", tag:"STUB", icon:"🐉", name:"Stub Dragon", title:"Refund Wyrm", text:"throw new Error(\"Not implemented\")", file:"src/billing/refund.ts", line:9, ageDays:41, taunt:"You summoned me unfinished.", hp:420 },
    { id:"m4", tag:"SILENT", icon:"👻", name:"Silent Exception", title:"The Swallowed Webhook", text:"catch (e) {}", file:"src/webhooks/stripe.ts", line:88, ageDays:120, taunt:"You caught me. Then ignored me.", hp:360 },
    { id:"m5", tag:"HACK", icon:"💀", name:"Hack Beast", title:"Timezone Duct-Tape Lich", text:"add 5 hours because server is UTC", file:"src/utils/date.ts", line:33, ageDays:402, taunt:"Temporary. For four hundred days.", hp:500 },
    { id:"m6", tag:"PLACEHOLDER", icon:"🧟", name:"Placeholder Zombie", title:"Real-Application Revenant", text:"In a real application you would validate this input", file:"src/api/signup.ts", line:24, ageDays:12, taunt:"In a real application, I wouldn't exist.", hp:206 },
    { id:"m7", tag:"TODO", icon:"👺", name:"TODO Goblin", title:"Pagination Imp", text:"paginate this, loads 10k rows", file:"src/admin/users.tsx", line:61, ageDays:95, taunt:"I've outlived three sprints.", hp:247 },
    { id:"m8", tag:"STUB", icon:"🐉", name:"Stub Dragon", title:"Email Verification Drake", text:"raise NotImplementedError", file:"worker/emails.py", line:42, ageDays:30, taunt:"Call me. I dare you.", hp:415 },
    { id:"m9", tag:"SILENT", icon:"👻", name:"Silent Exception", title:"Ghost of Retries Past", text:"except Exception: pass", file:"worker/sync.py", line:77, ageDays:256, taunt:"Shhh. The errors are sleeping.", hp:428 },
    { id:"m10", tag:"TODO", icon:"👺", name:"TODO Goblin", title:"Dark Mode Gremlin", text:"dark mode", file:"src/theme.css", line:3, ageDays:5, taunt:"You said you'd come back for me.", hp:202 },
    { id:"m11", tag:"FIXME", icon:"👹", name:"FIXME Troll", title:"Off-By-One Ogre", text:"last item is skipped sometimes??", file:"src/feed/list.ts", line:140, ageDays:77, taunt:"You knew I was broken.", hp:338 },
  ],
};

// ---------- State ----------
let state = { view: "home", data: null, demoCommits: 0, loading: false, error: "" };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let xp = store.get("ts_xp", 0);

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const levelOf = (x) => Math.floor(Math.sqrt(x / 150)) + 1;
const xpFor = (lv) => 150 * (lv - 1) ** 2;

function renderXp() {
  const lv = levelOf(xp), lo = xpFor(lv), hi = xpFor(lv + 1);
  document.getElementById("lvl").textContent = `LV ${lv}`;
  document.getElementById("xpnum").textContent = `${xp.toLocaleString()} XP`;
  document.getElementById("xpfill").style.width = `${Math.round(((xp - lo) / (hi - lo)) * 100)}%`;
}

// ---------- Views ----------
const app = document.getElementById("app");

function render() {
  renderXp();
  if (state.loading) {
    app.innerHTML = `<div class="loading"><span class="icon">🔮</span>Summoning monsters from<br>${esc(state.loading)}…</div>`;
    return;
  }
  if (state.view === "home") return renderHome();
  renderArena();
}

function renderHome() {
  const last = store.get("ts_last_repo", "");
  app.innerHTML = `
    <section class="hero">
      <h1>Your AI left <em>IOUs</em><br>in your code.<br>Now they're <em>monsters</em>.</h1>
      <p>Every TODO, FIXME, hack, placeholder, stub and swallowed exception in your repo becomes a monster.
         Fix the real code, push, rescan. Git is the referee — if it's gone from your latest commit, it's dead.</p>
      <button class="btn big" onclick="startDemo()">⚔️ TRY DEMO</button>
      <div class="or">— or fight your own repo —</div>
      <form class="summon" onsubmit="event.preventDefault(); summon(this.repo.value)">
        <input name="repo" placeholder="github.com/you/your-repo" value="${esc(last)}" autocomplete="off" spellcheck="false" />
        <button class="btn gold" type="submit">SUMMON</button>
      </form>
      ${state.error ? `<div class="err">${esc(state.error)}</div>` : ""}
      <div class="fine">Public repos only · no login · nothing stored on our side</div>
      <section class="howto">
        <h2>HOW TO PLAY</h2>
        <ol class="steps">
          <li><span class="num">1</span><img src="img/todo.webp" alt="" /><b>Summon</b><p>Paste any public GitHub repo. Every TODO, FIXME, hack, placeholder, stub and swallowed error spawns a monster.</p></li>
          <li><span class="num">2</span><img src="img/boss.webp" alt="" /><b>Meet them</b><p>Turn on 🔊 SOUND and click a monster to hear it. The oldest debt in your repo is the final boss.</p></li>
          <li><span class="num">3</span><img src="img/stub.webp" alt="" /><b>Fix the code</b><p>Click 📍 to jump to the exact line on GitHub. Actually fix it, then commit and push.</p></li>
          <li><span class="num">4</span><img src="img/silent.webp" alt="" /><b>Rescan &amp; slay</b><p>Hit 🔁 RESCAN. Git checks your new commit: gone from the code means dead. You earn XP and a ledger link to the diff.</p></li>
        </ol>
        <div class="fine">No repo handy? Hit <b>TRY DEMO</b> above for a ready-made army.</div>
      </section>
      <div class="legend">
        <span class="chip">👺 TODO Goblin</span><span class="chip">👹 FIXME Troll</span><span class="chip">💀 Hack Beast</span>
        <span class="chip">🧟 Placeholder Zombie</span><span class="chip">🐉 Stub Dragon</span><span class="chip">👻 Silent Exception</span>
      </div>
    </section>`;
}

function card(m, data) {
  const t = TYPES[m.tag] || TYPES.TODO;
  const href = data.demo ? null : `https://github.com/${data.repo}/blob/${data.sha}/${m.file.split("/").map(encodeURIComponent).join("/")}#L${m.line}`;
  const where = `${esc(m.file)}:${m.line}`;
  const age = m.ageDays != null
    ? `<div class="age">🕰 ${m.ageDays.toLocaleString()} days old${m.bornOn ? ` · born ${esc(m.bornOn)}` : ""}${m.author ? ` · by ${esc(m.author)}` : ""}</div>` : "";
  return `
    <article class="card ${m.boss ? "boss" : ""}" data-id="${esc(m.id)}" onclick="cardTalk(event, this)" title="Click to hear it">
      ${m.boss ? `<div class="badge" style="color:var(--blood)">☠ FINAL BOSS · OLDEST DEBT IN THE REPO</div>` : ""}
      <div class="top">
        <img class="sprite" src="img/${m.boss ? "boss" : (SPRITES[m.tag] || "todo")}.webp" alt="${esc(m.name)}" loading="lazy" />
        <div>
          <div class="badge" style="color:${t.color}">${t.label}</div>
          <div class="name">${esc(m.title || m.name)}</div>
        </div>
      </div>
      <div class="quote">${esc(m.text)}</div>
      ${href ? `<a class="where" href="${href}" target="_blank" rel="noopener">📍 ${where}</a>` : `<span class="where">📍 ${where}</span>`}
      ${age}
      <div class="taunt">“${esc(m.taunt)}”</div>
      <div class="hp"><i style="width:100%"></i></div>
      <div class="hpnum">HP ${m.hp.toLocaleString()}</div>
    </article>`;
}

function renderArena() {
  const d = state.data;
  const ms = d.monsters;
  const total = ms.reduce((s, m) => s + m.hp, 0);
  const oldest = ms.reduce((a, m) => Math.max(a, m.ageDays ?? 0), 0);
  const boss = ms.find((m) => m.boss);
  const rest = ms.filter((m) => !m.boss);
  app.innerHTML = `
    <div class="bar">
      <div>
        <div class="repo">${esc(d.repo)} ${d.demo ? `<span class="demo-tag">DEMO</span>` : ""}</div>
        <div class="sha">commit ${esc((d.sha || "").slice(0, 7))} · “${esc(d.commitMsg || "")}”</div>
      </div>
      <div class="stats">
        <div>ALIVE<b>${ms.length}</b></div>
        <div>TOTAL HP<b>${total.toLocaleString()}</b></div>
        ${oldest ? `<div>OLDEST<b>${oldest}d</b></div>` : ""}
        <div>SLAIN<b style="color:var(--mint)">${ledgerOf(d).length}</b></div>
      </div>
      <div class="actions">
        ${d.demo
          ? `<button class="btn gold" onclick="demoCommit()">💾 SIMULATE A FIX COMMIT</button>`
          : `<button class="btn gold" id="rescan" onclick="rescan()">🔁 RESCAN AFTER PUSH</button>`}
        <button class="btn ghost" onclick="copyReport()">📋 BRAG</button>
      </div>
    </div>
    ${d.demo
      ? `<p class="hint">This is a demo army. In the real game you fix the code, <b>git push</b>, and hit Rescan — anything missing from your latest commit dies.</p>`
      : `<p class="hint">Fix any of these in your code, push to <b>${esc(d.branch || "your default branch")}</b>, then hit Rescan. Only what's gone from the new commit dies.
         <br><span style="font-size:12px">${d.filesScanned} files scanned${d.totalFiles > d.filesScanned ? ` (of ${d.totalFiles} — big repo, first ${d.filesScanned} checked)` : ""}${d.totalMonsters > ms.length && ms.length ? ` · showing first ${ms.length} of ${d.totalMonsters} monsters` : ""}</span></p>`}
    ${ms.length === 0
      ? `<div class="victory"><h2>🏆 REPO CLEANSED</h2><p>Not a single IOU left in ${esc(d.repo)}. Your future self thanks you.</p>
         <button class="btn" onclick="goHome()">FIGHT ANOTHER REPO</button></div>`
      : `${boss ? `<div class="grid" style="margin-bottom:12px">${card(boss, d)}</div>` : ""}
         <div class="grid">${rest.map((m) => card(m, d)).join("")}</div>`}
    ${ledgerHtml(d)}
  `;
}

const ledgerOf = (d) => (d.demo ? state.demoLedger || [] : store.get(`ts_ledger_${d.repo}`, []));

function ledgerHtml(d) {
  const led = ledgerOf(d);
  if (!led.length) return "";
  const hp = led.reduce((s, k) => s + k.hp, 0);
  const commits = new Set(led.map((k) => k.to)).size;
  return `
    <section class="ledger">
      <h3>⚔️ KILL LEDGER · ${led.length} SLAIN · ${hp.toLocaleString()} HP · ${commits} COMMIT${commits > 1 ? "S" : ""}</h3>
      <p class="hint">${d.demo ? "In the real game every row links to the git diff that killed it." : "Every kill is a real commit. Click a row to see the exact diff that did it."}</p>
      ${led.map((k) => {
        const proof = d.demo
          ? `<span class="sha2">${esc(k.to.slice(0, 7))}</span>`
          : `<a class="sha2" target="_blank" rel="noopener" href="https://github.com/${esc(d.repo)}/compare/${esc(k.from)}...${esc(k.to)}">${esc(k.from.slice(0, 7))} → ${esc(k.to.slice(0, 7))} ↗</a>`;
        return `<div class="kill"><span>${esc(k.icon)} ${esc(k.title)}${k.boss ? " ☠" : ""}${k.ageDays != null ? ` <i>${k.ageDays}d old</i>` : ""}</span><span class="file">${esc(k.file)}</span><span class="hpk">+${k.hp}</span>${proof}</div>`;
      }).join("")}
    </section>`;
}

// ---------- Battle ----------
function banner(html, cls = "") {
  document.querySelectorAll(".banner").forEach((b) => b.remove());
  const el = document.createElement("div");
  el.className = `banner ${cls}`;
  el.innerHTML = html;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

async function resolveBattle(prev, next) {
  state.busy = true;
  const nextIds = new Set(next.monsters.map((m) => m.id));
  const prevIds = new Set(prev.monsters.map((m) => m.id));
  const killed = prev.monsters.filter((m) => !nextIds.has(m.id));
  const spawned = next.monsters.filter((m) => !prevIds.has(m.id));
  const gained = killed.reduce((s, m) => s + m.hp, 0) + (killed.some((m) => m.boss) ? 500 : 0);

  await verifySequence(prev, next, killed.length, spawned.length);
  if (killed.length) say(killed.some((m) => m.boss) ? pick(BOSS_DEATH) : pick(DEATH), killed.some((m) => m.boss));

  // Animate kills on the current board before swapping in the new state.
  killed.forEach((m, i) => {
    const el = document.querySelector(`.card[data-id="${CSS.escape(m.id)}"]`);
    if (!el) return;
    setTimeout(() => {
      el.classList.add("dying");
      burst(el, (TYPES[m.tag] || TYPES.TODO).color);
      sfx.hit(); setTimeout(() => sfx.boom(m.boss), 120);
      const dmg = document.createElement("div");
      dmg.className = "dmg";
      dmg.textContent = `-${m.hp}`;
      el.appendChild(dmg);
    }, i * 220);
  });

  const sha = (next.sha || "").slice(0, 7);
  if (killed.length) {
    banner(`COMMIT ${esc(sha)} VERIFIED<br><span class="kills">⚔️ ${killed.length} SLAIN${killed.some((m) => m.boss) ? " · BOSS DOWN" : ""}</span><br><span class="gain">+${gained.toLocaleString()} XP</span>${spawned.length ? `<br>…but ${spawned.length} new monster${spawned.length > 1 ? "s" : ""} crawled in` : ""}`);
  } else if (spawned.length) {
    banner(`COMMIT ${esc(sha)}<br>👀 ${spawned.length} NEW MONSTER${spawned.length > 1 ? "S" : ""} SPAWNED<br>Your AI has been busy.`, "new");
  } else {
    banner(`COMMIT ${esc(sha)}<br>No kills yet.<br>Fix something and push, then rescan.`, "new");
  }

  await new Promise((r) => setTimeout(r, killed.length ? 900 + killed.length * 220 : 0));
  // Kill ledger: the proof. Each entry links to the exact diff (prev commit → new commit) that removed the debt.
  if (killed.length) {
    const at = new Date().toISOString().slice(0, 10);
    const entries = killed.map((m) => ({ title: m.title || m.name, icon: m.icon, tag: m.tag, file: m.file, hp: m.hp, boss: !!m.boss, ageDays: m.ageDays ?? null, from: prev.sha, to: next.sha, at }));
    if (next.demo) state.demoLedger = [...entries, ...(state.demoLedger || [])];
    else store.set(`ts_ledger_${next.repo}`, [...entries, ...store.get(`ts_ledger_${next.repo}`, [])].slice(0, 300));
  }
  const lvBefore = levelOf(xp);
  xp += gained;
  store.set("ts_xp", xp);
  if (levelOf(xp) > lvBefore) { sfx.level(); setTimeout(() => banner(`⬆️ LEVEL UP<br><span class="gain">LV ${levelOf(xp)}</span>`), 600); }
  state.data = next;
  state.busy = false;
  render();
}

// ---------- Actions ----------
function goHome() { state = { ...state, view: "home", data: null, error: "" }; render(); }

function startDemo() {
  state = { view: "arena", data: structuredClone(DEMO), demoCommits: 0, demoLedger: [], loading: false, error: "" };
  render();
  arenaIntro(state.data);
}

function demoCommit() {
  const d = state.data;
  if (!d.monsters.length || state.busy) return;
  state.demoCommits++;
  const killCount = Math.min(d.monsters.length, 2 + (state.demoCommits % 2));
  const pool = d.monsters.filter((m) => !m.boss);
  const boss = d.monsters.find((m) => m.boss);
  // Boss falls on the 3rd commit (or when it's the last one standing) — that's the money shot.
  const victims = state.demoCommits >= 3 && boss ? [boss, ...pool.slice(0, killCount - 1)] : pool.slice(0, killCount);
  const ids = new Set((victims.length ? victims : d.monsters).map((m) => m.id));
  const next = { ...d, sha: Math.random().toString(16).slice(2, 10), commitMsg: ["fix: actually handle errors", "feat: implement the thing", "chore: remove placeholders"][state.demoCommits % 3], monsters: d.monsters.filter((m) => !ids.has(m.id)) };
  resolveBattle(d, next);
}

async function fetchScan(repo) {
  const r = await fetch(`/api/scan?repo=${encodeURIComponent(repo)}`);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `Scan failed (${r.status})`);
  return j;
}

async function summon(input) {
  const repo = String(input || "").trim();
  if (!repo) return;
  state = { ...state, loading: repo, error: "" };
  render();
  try {
    const data = await fetchScan(repo);
    store.set("ts_last_repo", data.repo);
    const prev = store.get(`ts_scan_${data.repo}`, null);
    store.set(`ts_scan_${data.repo}`, { sha: data.sha, monsters: data.monsters });
    state = { ...state, loading: false, view: "arena" };
    // Returning player: show the board as you left it, then resolve what your commits killed since.
    if (prev && prev.sha !== data.sha) {
      state.data = { ...data, sha: prev.sha, commitMsg: "your last visit", monsters: prev.monsters };
      render();
      setTimeout(() => resolveBattle(state.data, data), 600);
    } else {
      state.data = data;
      render();
      arenaIntro(data);
    }
  } catch (e) {
    state = { ...state, loading: false, view: "home", error: e.message };
    render();
  }
}

async function rescan() {
  const prev = state.data;
  const btn = document.getElementById("rescan");
  if (btn) { btn.disabled = true; btn.textContent = "SCANNING…"; }
  try {
    const next = await fetchScan(prev.repo);
    store.set(`ts_scan_${next.repo}`, { sha: next.sha, monsters: next.monsters });
    await resolveBattle(prev, next);
  } catch (e) {
    banner(`⚠️ ${esc(e.message)}`, "new");
    if (btn) { btn.disabled = false; btn.textContent = "🔁 RESCAN AFTER PUSH"; }
  }
}

function copyReport() {
  const d = state.data;
  const boss = d.monsters.find((m) => m.boss);
  const text = d.monsters.length
    ? `⚔️ TODO Slayer: ${ledgerOf(d).length} monsters slain in ${d.repo} (every kill is a real commit), ${d.monsters.length} still alive${boss ? `, led by "${boss.title || boss.name}" (${boss.ageDays} days old)` : ""}. I'm LV ${levelOf(xp)} with ${xp} XP. ${location.origin}`
    : `🏆 TODO Slayer: I cleansed ${d.repo} — zero IOUs left. LV ${levelOf(xp)}, ${xp} XP. ${location.origin}`;
  navigator.clipboard?.writeText(text).then(() => banner("📋 Battle report copied"), () => banner(esc(text)));
}

// ---------- Sound: synthesized SFX (no assets) + browser speech for monster voices ----------
let soundOn = store.get("ts_sound", false);
let ac = null;
const actx = () => (ac ||= new (window.AudioContext || window.webkitAudioContext)());

function tone({ type = "sawtooth", f0 = 80, f1 = 40, dur = 0.5, vol = 0.25, lp = 900, delay = 0 }) {
  if (!soundOn) return;
  const c = actx(), t = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  f.type = "lowpass"; f.frequency.value = lp;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(f).connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
}
function noise({ dur = 0.4, vol = 0.3, lp0 = 3000, lp1 = 200, delay = 0 }) {
  if (!soundOn) return;
  const c = actx(), t = c.currentTime + delay;
  const buf = c.createBuffer(1, Math.ceil(c.sampleRate * dur), c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  src.buffer = buf; f.type = "lowpass"; f.frequency.setValueAtTime(lp0, t); f.frequency.exponentialRampToValueAtTime(lp1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f).connect(g).connect(c.destination); src.start(t);
}
const sfx = {
  growl: () => { tone({ f0: 70, f1: 45, dur: 0.9, vol: 0.22, lp: 500 }); tone({ type: "square", f0: 55, f1: 38, dur: 0.9, vol: 0.08, lp: 300 }); },
  hit: () => { noise({ dur: 0.12, vol: 0.35, lp0: 6000, lp1: 1500 }); tone({ type: "triangle", f0: 900, f1: 300, dur: 0.12, vol: 0.15, lp: 4000 }); },
  boom: (big) => { noise({ dur: big ? 1.2 : 0.6, vol: big ? 0.5 : 0.35, lp0: 2500, lp1: 60 }); tone({ type: "sine", f0: big ? 90 : 120, f1: 30, dur: big ? 1 : 0.5, vol: 0.3, lp: 400 }); },
  tick: () => tone({ type: "square", f0: 1200, f1: 1200, dur: 0.05, vol: 0.05, lp: 5000 }),
  level: () => [523, 659, 784, 1047].forEach((f, i) => tone({ type: "square", f0: f, f1: f, dur: 0.14, vol: 0.08, lp: 5000, delay: i * 0.09 })),
};

let voice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices().filter((v) => /^en/i.test(v.lang));
  voice = vs.find((v) => /male|daniel|fred|alex|google uk english male/i.test(v.name)) || vs[0] || null;
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text, boss = false) {
  if (!soundOn || !("speechSynthesis" in window) || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if (voice) u.voice = voice;
  u.pitch = 0.05; u.rate = boss ? 0.62 : 0.8; u.volume = 1;
  speechSynthesis.speak(u);
}
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const DEATH = ["Noooo!", "You got me.", "I'll be back.", "The code... is clean.", "Impossible!", "Fine. Ship it."];
const BOSS_DEATH = ["No... After all these days... you actually fixed me.", "Impossible! I was ancient!"];

function toggleSound() {
  soundOn = !soundOn;
  store.set("ts_sound", soundOn);
  renderSoundBtn();
  if (soundOn) { actx().resume?.(); sfx.level(); say("Fresh meat."); } else speechSynthesis?.cancel();
}
function renderSoundBtn() { const b = document.getElementById("snd"); if (b) b.textContent = soundOn ? "🔊 SOUND" : "🔇 SOUND"; }

function arenaIntro(d) {
  const boss = d.monsters.find((m) => m.boss) || d.monsters[0];
  if (!boss) return;
  setTimeout(() => { sfx.growl(); say(boss.taunt, !!boss.boss); }, 350);
}

function cardTalk(e, el) {
  if (e.target.closest("a")) return;
  const m = state.data?.monsters.find((x) => x.id === el.dataset.id);
  if (!m) return;
  el.classList.remove("talk"); void el.offsetWidth; el.classList.add("talk");
  if (!soundOn) { banner("🔇 Turn on SOUND to hear it", "new"); return; }
  sfx.growl(); say(m.taunt, !!m.boss);
}

function burst(el, color) {
  const r = el.getBoundingClientRect();
  for (let i = 0; i < 18; i++) {
    const p = document.createElement("i");
    p.className = "spark";
    const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 140;
    p.style.cssText = `left:${r.left + r.width / 2}px;top:${r.top + r.height / 2}px;background:${i % 3 ? color : "#fff"};--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d}px`;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 800);
  }
}

// The proof, staged: every line is a real step for real repos.
async function verifySequence(prev, next, kills, spawns) {
  const o = document.createElement("div");
  o.className = "verify";
  document.body.appendChild(o);
  const steps = next.demo
    ? [`DEMO COMMIT ${next.sha.slice(0, 7)}`, `✓ Re-scanned the repo`, `✓ Compared with ${prev.sha.slice(0, 7)}`, `✓ ${kills} finding${kills === 1 ? "" : "s"} gone → slain`]
    : [`VERIFYING COMMIT ${next.sha.slice(0, 7)}…`, `✓ Re-read ${next.filesScanned} files at that exact commit`, `✓ Compared with ${prev.sha.slice(0, 7)}`, `✓ ${kills} finding${kills === 1 ? "" : "s"} gone${spawns ? ` · ${spawns} new` : ""}`];
  for (const line of steps) {
    const row = document.createElement("div");
    row.textContent = line;
    o.appendChild(row);
    sfx.tick();
    await new Promise((r) => setTimeout(r, 260));
  }
  await new Promise((r) => setTimeout(r, 350));
  o.classList.add("out");
  setTimeout(() => o.remove(), 300);
}

renderSoundBtn();
render();
</script>
